<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- 🔥 ESSENCIAL PARA MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Medidor de Ruído</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }

  h1 {
    font-size: 5vw;
    margin-bottom: 10px;
  }

  #db {
    font-size: 25vw; /* 🔥 escala com a tela */
    font-weight: bold;
    margin: 10px 0;
  }

  #nivel {
    font-size: 6vw;
    margin-bottom: 20px;
  }

  button {
    width: 80%;
    max-width: 300px;
    font-size: 6vw;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: #00c853;
    color: white;
    cursor: pointer;
  }

  #status {
    margin-top: 15px;
    font-size: 4vw;
    color: #aaa;
  }
</style>
</head>

<body>

<h1>Medidor de Ruído</h1>

<div id="db">--</div>
<div id="nivel">Aguardando</div>

<button onclick="iniciar()">Iniciar</button>

<div id="status">Permita o uso do microfone</div>

<script>
let analyser, dataArray;
let historico = [];
  let dbSuavizado = 40;

let baseline = null; // nível de silêncio

async function iniciar() {
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();

  if (audioContext.state === "suspended") {
    await audioContext.resume();
  }

  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  analyser = audioContext.createAnalyser();
  const source = audioContext.createMediaStreamSource(stream);

  source.connect(analyser);

  analyser.fftSize = 512;
  dataArray = new Uint8Array(analyser.fftSize);

  document.getElementById("status").innerText = "Calibrando ambiente...";

  // 🔧 Calibra por 1 segundo
  let amostras = [];

  for (let i = 0; i < 30; i++) {
    analyser.getByteTimeDomainData(dataArray);

    let sum = 0;
    for (let j = 0; j < dataArray.length; j++) {
      let x = dataArray[j] - 128;
      sum += x * x;
    }

    let rms = Math.sqrt(sum / dataArray.length);
    amostras.push(rms);

    await new Promise(r => setTimeout(r, 30));
  }

  baseline = amostras.reduce((a,b)=>a+b,0) / amostras.length;

  document.getElementById("status").innerText = "Captando som...";

  medir();
}

function medir() {
  analyser.getByteTimeDomainData(dataArray);

  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    let x = dataArray[i] - 128;
    sum += x * x;
  }

  let rms = Math.sqrt(sum / dataArray.length);

  // 🔥 compara com o silêncio
 let ratio = rms / (baseline * 1.5);

  let db = 20 * Math.log10(Math.max(ratio));

let dbFinal = 45 + (db * 1);

// limitar faixa
dbFinal = Math.max(0, Math.min(120, dbFinal));

  // suavização
dbSuavizado = dbSuavizado * 0.92 + dbFinal * 0.08;

let dbAtual = Math.round(dbSuavizado);

  document.getElementById("db").innerText = dbAtual;

  // classificação
  let nivel = "";
  let cor = "";

  if (dbAtual < 50) {
    nivel = "Baixo";
    cor = "#00e676";
  } else if (dbAtual < 70) {
    nivel = "Moderado";
    cor = "#ffeb3b";
  } else {
    nivel = "Alto";
    cor = "#ff1744";
  }

  document.getElementById("nivel").innerText = nivel;
  document.getElementById("db").style.color = cor;

  requestAnimationFrame(medir);
}
</script>

</body>
</html>
