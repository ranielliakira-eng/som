<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Medidor de Ruído</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: #fff;
      padding-top: 50px;
    }
    #db {
      font-size: 60px;
      margin: 20px;
    }
    button {
      padding: 15px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #00c853;
      color: white;
    }
  </style>
</head>
<body>

<h1>Medidor de Ruído</h1>
<div id="db">Clique em iniciar</div>
<button onclick="iniciar()">Iniciar</button>
<button onclick="capturar()">Capturar</button>

<div id="historico"></div>

<script>
let dbAtual = 0;
let historico = [];
let analyser, dataArray;

async function iniciar() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();

    const source = audioContext.createMediaStreamSource(stream);
    source.connect(analyser);

    analyser.fftSize = 512;
    dataArray = new Uint8Array(analyser.fftSize);

    medir();
  } catch (e) {
    alert("Erro ao acessar microfone. Verifique permissões.");
    console.error(e);
  }
}

function medir() {
  analyser.getByteTimeDomainData(dataArray);

  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    let x = dataArray[i] - 128;
    sum += x * x;
  }

  let rms = Math.sqrt(sum / dataArray.length);
  let db = 20 * Math.log10(rms);

  dbAtual = Math.max(0, Math.round(db + 100)); // ajuste visual

  document.getElementById("db").innerText = dbAtual + " dB";

  requestAnimationFrame(medir);
}

function capturar() {
  let hora = new Date().toLocaleTimeString();
  historico.unshift(`${hora} - ${dbAtual} dB`);

  document.getElementById("historico").innerHTML =
    "<h3>Histórico</h3>" +
    historico.map(h => `<div>${h}</div>`).join("");
}
</script>

</body>
</html>
