<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Medidor de Ruído</title>
 <style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  h1 {
    font-size: 28px;
    margin-bottom: 10px;
  }

  #db {
    font-size: 120px; /* 🔥 número gigante */
    font-weight: bold;
    margin: 20px 0;
  }

  #nivel {
    font-size: 24px;
    margin-bottom: 20px;
  }

  button {
    font-size: 20px;
    padding: 15px 30px;
    border-radius: 10px;
    border: none;
    background: #00c853;
    color: white;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>Medidor de Ruído</h1>
<div id="db">Clique em iniciar</div>
<button onclick="iniciar()">Iniciar</button>
<button onclick="capturar()">Capturar</button>

<div id="historico"></div>

<script>
let dbAtual = 0;
let historico = [];
let analyser, dataArray;

async function iniciar() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();

    const source = audioContext.createMediaStreamSource(stream);
    source.connect(analyser);

    analyser.fftSize = 512;
    dataArray = new Uint8Array(analyser.fftSize);

    medir();
  } catch (e) {
    alert("Erro ao acessar microfone. Verifique permissões.");
    console.error(e);
  }
}

function medir() {
  analyser.getByteTimeDomainData(dataArray);

  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    let x = dataArray[i] - 128;
    sum += x * x;
  }

  let rms = Math.sqrt(sum / dataArray.length);
  let db = 20 * Math.log10(rms);

  dbAtual = Math.max(0, Math.round(db + 100)); // ajuste visual

  document.getElementById("db").innerText = dbAtual + " dB";

  requestAnimationFrame(medir);
}

function capturar() {
  let hora = new Date().toLocaleTimeString();
  historico.unshift(`${hora} - ${dbAtual} dB`);

  document.getElementById("historico").innerHTML =
    "<h3>Histórico</h3>" +
    historico.map(h => `<div>${h}</div>`).join("");
}
</script>

</body>
</html>
