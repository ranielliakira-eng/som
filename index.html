<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- 🔥 ESSENCIAL PARA MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Medidor de Ruído</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }

  h1 {
    font-size: 5vw;
    margin-bottom: 10px;
  }

  #db {
    font-size: 25vw; /* 🔥 escala com a tela */
    font-weight: bold;
    margin: 10px 0;
  }

  #nivel {
    font-size: 6vw;
    margin-bottom: 20px;
  }

  button {
    width: 80%;
    max-width: 300px;
    font-size: 6vw;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: #00c853;
    color: white;
    cursor: pointer;
  }

  #status {
    margin-top: 15px;
    font-size: 4vw;
    color: #aaa;
  }
</style>
</head>

<body>

<h1>Medidor de Ruído</h1>

<div id="db">--</div>
<div id="nivel">Aguardando</div>

<button onclick="iniciar()">Iniciar</button>

<div id="status">Permita o uso do microfone</div>

<script>
let analyser, dataArray;
let historico = [];

async function iniciar() {
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    if (audioContext.state === "suspended") {
      await audioContext.resume();
    }

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    analyser = audioContext.createAnalyser();
    const source = audioContext.createMediaStreamSource(stream);

    source.connect(analyser);

    analyser.fftSize = 512;
    dataArray = new Uint8Array(analyser.fftSize);

    document.getElementById("status").innerText = "Captando som...";

    medir();

  } catch (e) {
    document.getElementById("status").innerText = "Erro ao acessar microfone";
    console.error(e);
  }
}

function medir() {
  analyser.getByteTimeDomainData(dataArray);

  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    let x = dataArray[i] - 128;
    sum += x * x;
  }

  let rms = Math.sqrt(sum / dataArray.length);
  let db = 20 * Math.log10(rms);

  db = db; // ajuste

  historico.push(db);
  if (historico.length > 5) historico.shift();

  let media = historico.reduce((a,b)=>a+b,0) / historico.length;
  let dbAtual = Math.round(Math.max(0, media));

  document.getElementById("db").innerText = dbAtual;

  let nivel = "";
  let cor = "";

  if (dbAtual < 50) {
    nivel = "Baixo";
    cor = "#00e676";
  } else if (dbAtual < 70) {
    nivel = "Moderado";
    cor = "#ffeb3b";
  } else {
    nivel = "Alto";
    cor = "#ff1744";
  }

  document.getElementById("nivel").innerText = nivel;
  document.getElementById("db").style.color = cor;

  requestAnimationFrame(medir);
}
</script>

</body>
</html>
